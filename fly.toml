# Deploy command (run from repo root):
#   fly launch --no-deploy        # first time: creates the app on Fly.io
#   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... ML_SERVICE_API_KEY=...
#   fly deploy
#
# The build context is the repo root so the Dockerfile can access models/

app = "carebridge-ml"
primary_region = "iad"

[build]
  dockerfile = "ml-service/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "10s"
    type = "http"
